format:
  revealjs:
    include-after-body:
      text: |
        <script>
          function retypeset() {
            if (window.MathJax && MathJax.typesetPromise) {
              MathJax.typesetPromise();
            }
          }
          window.addEventListener('load', function () {
            if (typeof Reveal !== 'undefined') {
              Reveal.on('ready', retypeset);
              Reveal.on('slidechanged', retypeset);
            }
          });
        </script>