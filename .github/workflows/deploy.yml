name: Build and Deploy Teaching Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r py_requirements.txt

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate course glossaries
        run: python collect_definitions.py

      # ── Render slide decks ────────────────────────────────────────────────
      # The slides/ folder is a separate Quarto project (type: default) that
      # references lecture .qmd files via relative paths. Running quarto render
      # here is completely independent of the book project at the repo root.
      # To add a new course, add its L*.qmd glob to slides/_quarto.yml render list.
      - name: Render slide decks
        run: quarto render slides/

      # ── Render textbook ───────────────────────────────────────────────────
      - name: Render textbook
        run: quarto render

      # Copy slide output into the book site so everything deploys together
      - name: Copy slides into site output
        run: |
          mkdir -p _site/_slides
          cp -r slides/_output/* _site/_slides/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
