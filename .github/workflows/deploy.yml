name: Build and Deploy Teaching Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r py_requirements.txt

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate course glossaries
        run: python collect_definitions.py

      - name: Render slide decks
        run: |
          find . -path './_site' -prune -o -path './_slides' -prune -o \
            -name 'L*.qmd' -print | while read f; do
            dir=$(dirname "$f")
            quarto render "$f" \
              --no-project \
              --to revealjs \
              --output-dir "_slides/$dir" \
              -M embed-resources:true \
              -M slide-number:true \
              -M controls:true \
              -M progress:true \
              -M theme:simple \
              -M html-math-method:mathjax \
              -M width:1050 \
              -M height:700 \
              -M margin:0.1 \
              -M navigationMode:linear \
              -M transition:none
          done

      - name: Render textbook
        run: quarto render

      - name: Copy slides into site output
        run: |
          mkdir -p _site/_slides
          cp -r _slides/* _site/_slides/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4